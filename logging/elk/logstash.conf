input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json
  }
}

filter {
  if ![service] {
    mutate { add_field => { "service" => "devplane" } }
  }
  if [level] == "error" {
    mutate { add_tag => ["error"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devplane-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug { metadata => false } }
}
