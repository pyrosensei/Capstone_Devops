name: DevPlane CI

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            compose_files: docker-compose.yml
            compose_profiles: ''
          - database: postgres
            compose_files: docker-compose.yml:docker-compose.postgres.yml
            compose_profiles: postgres
    name: Verify (${{ matrix.database }})
    env:
      COMPOSE_FILE: ${{ matrix.compose_files }}
      COMPOSE_PROFILES: ${{ matrix.compose_profiles }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python and browser JavaScript
        run: |
          python -m ruff check app tests worker scripts/local_demo.py scripts/smoke.py
          node --check app/static/app.js

      - name: Run tests and report coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Set up disposable Compose credentials
        id: credentials
        shell: bash
        run: |
          secret_key=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          metrics_token=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          printf '::add-mask::%s\n' "$secret_key" "$metrics_token"
          printf 'SECRET_KEY=%s\nMETRICS_TOKEN=%s\nDEMO_MODE=true\n' \
            "$secret_key" "$metrics_token" >> "$GITHUB_ENV"

      - name: Build and start the Compose stack
        run: |
          docker compose up --build --wait --wait-timeout 120 api redis
          docker compose up -d --no-build worker

      - name: Smoke test the built application
        run: |
          python scripts/smoke.py --require-redis
          docker compose ps --status running --services worker | grep -Fx worker

      - name: Verify PostgreSQL data survives a restart
        if: matrix.database == 'postgres'
        run: |
          docker compose restart api
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health/ready
          docker compose exec -T postgres psql -U devplane -d devplane -Atc \
            "SELECT EXISTS (SELECT 1 FROM deployments WHERE is_rollback AND status = 'succeeded')" | grep -Fx t

      - name: Show service status and logs on failure
        if: ${{ failure() && steps.credentials.outcome == 'success' }}
        run: |
          docker compose ps --all
          docker compose logs --tail 100 api worker redis

      - name: Stop Compose services
        if: ${{ always() && steps.credentials.outcome == 'success' }}
        run: docker compose down
