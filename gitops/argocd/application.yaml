apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devplane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/Capstone_Devops.git
    targetRevision: main
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devplane
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
