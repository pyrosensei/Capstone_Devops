global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: devplane

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: devplane-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          instance: compose-api

  # Use this target when Prometheus runs standalone and the API is on the host.
  - job_name: devplane-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          instance: host-api
