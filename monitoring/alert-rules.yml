groups:
  - name: devplane.rules
    rules:
      - alert: DevPlaneApiDown
        expr: up{job="devplane-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DevPlane API is not scrapeable"
          description: "Prometheus cannot reach the DevPlane /metrics endpoint."

      - alert: DevPlaneHighErrorRate
        expr: |
          sum(rate(devplane_http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(devplane_http_requests_total[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DevPlane 5xx error rate above 5%"
          description: "More than 5% of requests have failed for five minutes."

      - alert: DevPlaneSlowRequests
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(devplane_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DevPlane p95 latency above 1s"
          description: "p95 request latency has exceeded one second for ten minutes."

      - alert: DevPlaneDeploymentFailures
        expr: increase(devplane_deployments_total{status="failed"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A DevPlane deployment failed"
          description: "Check the deployment logs in the control plane."

      - alert: DevPlaneEnvironmentStuckProvisioning
        expr: devplane_environments{status="provisioning"} > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Multiple environments stuck provisioning"
          description: "More than three environments have been provisioning for 15 minutes."
