services:
  - type: web
    name: devplane-capstone
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: RUN_MIGRATIONS
        value: "1"
      - key: CORS_ORIGINS
        value: ""
      - key: REDIS_URL
        value: ""
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_DEV_EMAIL
        sync: false
      - key: BOOTSTRAP_DEV_PASSWORD
        sync: false
