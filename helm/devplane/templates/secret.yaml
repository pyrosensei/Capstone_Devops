{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devplane.fullname" . }}
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.SECRET_KEY is required" .Values.secret.SECRET_KEY | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ required "secret.BOOTSTRAP_ADMIN_PASSWORD is required" .Values.secret.BOOTSTRAP_ADMIN_PASSWORD | quote }}
  BOOTSTRAP_DEV_PASSWORD: {{ required "secret.BOOTSTRAP_DEV_PASSWORD is required" .Values.secret.BOOTSTRAP_DEV_PASSWORD | quote }}
  METRICS_TOKEN: {{ required "secret.METRICS_TOKEN is required" .Values.secret.METRICS_TOKEN | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secret.POSTGRES_PASSWORD is required when postgresql.enabled is true" .Values.secret.POSTGRES_PASSWORD | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s-postgres:5432/%s" .Values.postgresql.username (urlquery .Values.secret.POSTGRES_PASSWORD) (include "devplane.fullname" .) .Values.postgresql.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgresql.enabled is false" .Values.externalDatabase.url | quote }}
  {{- end }}
{{- end }}
