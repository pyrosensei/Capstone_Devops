{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devplane.fullname" . }}
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.SECRET_KEY is required" .Values.secret.SECRET_KEY | quote }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secret.BOOTSTRAP_ADMIN_PASSWORD | quote }}
  BOOTSTRAP_DEV_PASSWORD: {{ .Values.secret.BOOTSTRAP_DEV_PASSWORD | quote }}
{{- end }}
