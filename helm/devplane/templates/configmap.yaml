apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devplane.fullname" . }}-config
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  REDIS_URL: {{ include "devplane.redisUrl" . | quote }}
