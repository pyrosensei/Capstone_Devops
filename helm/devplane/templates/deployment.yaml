apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devplane.fullname" . }}
  labels:
    app: {{ include "devplane.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "devplane.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "devplane.fullname" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "devplane.fullname" . }}
                  key: SECRET_KEY
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devplane.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "devplane.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devplane.fullname" . }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secret.SECRET_KEY | quote }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devplane.fullname" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devplane.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
