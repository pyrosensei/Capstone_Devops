{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "devplane.serviceAccountName" . }}
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "devplane.fullname" . }}-ops
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "devplane.fullname" . }}-ops
  labels:
    {{- include "devplane.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devplane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "devplane.fullname" . }}-ops
  apiGroup: rbac.authorization.k8s.io
{{- end }}
