replicaCount: 2

image:
  repository: devplane-api
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: devplane.local
  path: /
  pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  APP_ENV: kubernetes
  APP_NAME: DevPlane
  DEMO_MODE: "false"
  LOG_LEVEL: INFO
  PROVISIONING_DELAY_SECONDS: "3"
  RUN_MIGRATIONS: "1"

secret:
  create: true
  SECRET_KEY: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""
  BOOTSTRAP_DEV_PASSWORD: ""
  POSTGRES_PASSWORD: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  database: devplane
  username: devplane
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalDatabase:
  url: ""

worker:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

externalRedis:
  url: redis://localhost:6379/0
