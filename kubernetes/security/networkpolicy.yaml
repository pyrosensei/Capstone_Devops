# Optional network hardening for clusters whose CNI enforces NetworkPolicy.
# Not part of the base kustomization so local kind demos cannot be broken by a
# CNI that does not support policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: devplane
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: devplane
spec:
  podSelector:
    matchLabels:
      app: devplane-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app: devplane-worker
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: devplane
spec:
  podSelector:
    matchLabels:
      app: devplane-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: devplane-api
        - podSelector:
            matchLabels:
              app: devplane-worker
      ports:
        - protocol: TCP
          port: 6379
