apiVersion: v1
kind: ServiceAccount
metadata:
  name: devplane
  namespace: devplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devplane-ops
  namespace: devplane
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devplane-ops
  namespace: devplane
subjects:
  - kind: ServiceAccount
    name: devplane
    namespace: devplane
roleRef:
  kind: Role
  name: devplane-ops
  apiGroup: rbac.authorization.k8s.io
