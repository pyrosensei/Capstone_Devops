apiVersion: v1
kind: Secret
metadata:
  name: devplane-secrets
  namespace: devplane
type: Opaque
stringData:
  SECRET_KEY: replace-with-a-strong-generated-secret
  POSTGRES_PASSWORD: replace-with-a-generated-password
  DATABASE_URL: postgresql+psycopg2://devplane:replace-with-a-generated-password@devplane-postgres:5432/devplane
  BOOTSTRAP_ADMIN_PASSWORD: replace-with-a-strong-admin-password
  BOOTSTRAP_DEV_PASSWORD: replace-with-a-strong-developer-password
  METRICS_TOKEN: replace-with-a-generated-metrics-token
