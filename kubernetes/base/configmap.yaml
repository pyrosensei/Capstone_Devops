apiVersion: v1
kind: ConfigMap
metadata:
  name: devplane-config
  namespace: devplane
data:
  APP_ENV: "kubernetes"
  APP_NAME: "DevPlane"
  DEMO_MODE: "false"
  RUN_MIGRATIONS: "1"
  REDIS_URL: "redis://devplane-redis:6379/0"
  LOG_LEVEL: "INFO"
  PROVISIONING_DELAY_SECONDS: "3"
  CORS_ORIGINS: "http://devplane.local,http://localhost:8000"
